<script>
__BENCHMARKS__
__EXPLORER_CORE__
const PAYLOAD = __CARDS__;
const AX = PAYLOAD.axes, LAB = PAYLOAD.labels, MODELS = PAYLOAD.models;

const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const fmtCtx=n=>!n?"—":n>=1e6?(n/1e6)+"M":Math.round(n/1e3)+"k";
const SERIES=["--series-0","--series-1","--series-2"];

const savedPreferences=readCreatorPreferences();
let pinnedCreators=new Set(savedPreferences.creators),pinnedOnly=savedPreferences.only,qualityFloor=savedPreferences.minIntelligence;
let state={view:"radar",costMode:"task",radarMode:"__RADAR_MODE__",sizeMode:MODELS.some(m=>m.params>0 && Number.isFinite(m.intel))?"total":"group",openSizes:new Set(["Small"]),openEvidence:new Set(["explore-index"]),selected:[(MODELS.find(m=>m.status==="current"&&(!pinnedOnly||pinnedCreators.has(m.creator)))||MODELS[0]).slug],q:"",creators:new Set(pinnedOnly?pinnedCreators:[]),lic:new Set(),maxPrice:Infinity,minCtx:0,sizes:new Set(),reasoning:new Set(),curOnly:true,axesOpen:false};

// ---------- filters ----------
function buildFilters(){
  const f=$("#filters");
  const lics=[...new Set(MODELS.map(m=>m.license).filter(Boolean))];
  const maxP=Math.ceil(Math.max(...MODELS.map(m=>m.price||0)));
  f.innerHTML="";
  refreshCreatorControls();
  const lg=el("div","filter-grp");lg.innerHTML="<span>가중치 공개 여부</span>";
  const lc=el("div","chips");
  lics.forEach(c=>{const b=el("button","chip");b.textContent=c==="Open"?"오픈":c==="Proprietary"?"독점":c;b.setAttribute("aria-pressed","false");
    b.onclick=()=>{b.getAttribute("aria-pressed")==="true"?(state.lic.delete(c),b.setAttribute("aria-pressed","false")):(state.lic.add(c),b.setAttribute("aria-pressed","true"));filtersChanged();};lc.appendChild(b);});
  lg.appendChild(lc);f.appendChild(lg);
  const pg=el("div","filter-grp");pg.innerHTML="<span>최대 토큰 혼합 단가 ($/1M)</span>";
  const pr=el("div","rng");const pi=el("input");pi.type="range";pi.setAttribute("aria-label","최대 혼합 단가");pi.min=0;pi.max=maxP;pi.value=maxP;pi.step=0.5;
  const pv=el("span");pv.textContent="≤$"+maxP;
  pi.oninput=()=>{state.maxPrice=+pi.value>=maxP?Infinity:+pi.value;pv.textContent=state.maxPrice===Infinity?"전체":"≤$"+(+pi.value);filtersChanged();};
  pv.textContent="전체";pr.append(pi,pv);pg.appendChild(pr);f.appendChild(pg);
  // 크기 (AA Size: 파라미터 버킷)
  const sg=el("div","filter-grp");sg.innerHTML="<span>크기 (파라미터)</span>";
  const sch=el("div","chips");
  const sizeLabel=s=>sizeRanges[s] ? s+" "+sizeRanges[s] : "크기 미상";
  ["Tiny","Small","Medium","Large","Unknown"].filter(s=>MODELS.some(m=>m.size===s)).forEach(s=>{
    const b=el("button","chip");b.textContent=sizeLabel(s);b.setAttribute("aria-pressed","false");
    b.onclick=()=>{b.getAttribute("aria-pressed")==="true"?(state.sizes.delete(s),b.setAttribute("aria-pressed","false")):(state.sizes.add(s),b.setAttribute("aria-pressed","true"));filtersChanged();};
    sch.appendChild(b);});
  sg.appendChild(sch);f.appendChild(sg);
  // 추론 (AA Reasoning)
  const rg=el("div","filter-grp");rg.innerHTML="<span>추론</span>";
  const rch=el("div","chips");
  [["R","추론"],["NR","비추론"]].forEach(([k,lab])=>{
    const b=el("button","chip");b.textContent=lab;b.setAttribute("aria-pressed","false");
    b.onclick=()=>{b.getAttribute("aria-pressed")==="true"?(state.reasoning.delete(k),b.setAttribute("aria-pressed","false")):(state.reasoning.add(k),b.setAttribute("aria-pressed","true"));filtersChanged();};
    rch.appendChild(b);});
  rg.appendChild(rch);f.appendChild(rg);
  // 상태 (AA Status: 기본 현행 모델만 — 해제 시 past 노출)
  const stg=el("div","filter-grp");stg.innerHTML="<span>상태</span>";
  const stc=el("div","chips");
  const cb=el("button","chip");cb.textContent="현행 모델만";cb.setAttribute("aria-pressed","true");
  cb.onclick=()=>{state.curOnly=!state.curOnly;cb.setAttribute("aria-pressed",String(state.curOnly));filtersChanged();};
  stc.appendChild(cb);stg.appendChild(stc);f.appendChild(stg);
}

function filtered(){
  return MODELS.filter(m=>{
    if(state.q && !m.name.toLowerCase().includes(state.q)) return false;
    if(state.creators.size && !state.creators.has(m.creator)) return false;
    if(state.lic.size && !state.lic.has(m.license)) return false;
    if(Number.isFinite(state.maxPrice) && (m.price==null || m.price>state.maxPrice)) return false;
    if(state.curOnly && m.status!=="current") return false;
    if(state.sizes.size && !state.sizes.has(m.size)) return false;
    if(state.reasoning.size){
      const k=m.reasoning===true?"R":m.reasoning===false?"NR":null;
      if(!k||!state.reasoning.has(k)) return false;
    }
    return true;
  });
}

// The open control determines which slot changes. Searching never changes the chart.
let replaceIndex=null;
function closePicker(restore=false) {
  $("#model-library").hidden=true;
  const trigger=replaceIndex===null ? $(".add-slot") : document.querySelectorAll(".replace-slot")[replaceIndex];
  trigger?.setAttribute("aria-expanded","false");
  if(restore) (trigger || $(".replace-slot")).focus();
}
function setFiltersOpen(open) {
  $("#advanced-filters").hidden=!open;
  $("#filter-toggle").setAttribute("aria-expanded",String(open));
}
function openPicker(index, trigger) {
  const same=!$("#model-library").hidden && replaceIndex===index;
  closePicker();
  if(same) return;
  setFiltersOpen(false);
  replaceIndex=index;
  $("#model-query").value="";
  $("#picker-title").textContent=index===null?"비교할 모델 추가":MODELS.find(m=>m.slug===state.selected[index]).name+" 교체";
  trigger.setAttribute("aria-expanded","true");
  $("#model-library").hidden=false;
  buildList();
  $("#model-query").focus();
}
function buildList(){
  const list=$("#list");
  const query=$("#model-query").value.trim().toLowerCase();
  const rows=filtered().filter(m=>(m.name+" "+m.creator).toLowerCase().includes(query));
  list.replaceChildren();
  for(const m of rows){
    const selected=state.selected.indexOf(m.slug);
    const pick=el("button","model-pick");
    pick.type="button";
    pick.disabled=selected>=0;
    const name=el("strong","nm");name.textContent=m.name;
    const detail=el("small");detail.textContent=m.creator+(m.status==="past"?" · 이전 모델":"");
    const score=el("span","ix");score.textContent=selected>=0?"비교 중":m.intel==null?"AA —":"AA "+m.intel.toFixed(1);
    pick.append(name,detail,score);
    pick.onclick=()=>{
      const index=replaceIndex??state.selected.length;
      closePicker();
      if(replaceIndex===null) state.selected.push(m.slug);
      else state.selected[index]=m.slug;
      render();
      document.querySelectorAll(".replace-slot")[index].focus();
      $("#comparison-status").classList.add("sr-only");
      $("#comparison-status").textContent=m.name+(replaceIndex===null?" 추가됨":" 교체됨");
    };
    list.append(pick);
  }
  if(!rows.length){
    const empty=el("p","empty");empty.textContent="일치하는 모델이 없습니다. 검색어나 필터를 바꿔 보세요.";list.append(empty);
  }
  $("#listcount").textContent=rows.length+(filterCount()?"개 · 필터 적용 중":"개 모델");
  list.scrollTop=0;
}
function filterCount(){
  return state.lic.size+state.sizes.size+state.reasoning.size+Number(Number.isFinite(state.maxPrice))+Number(!state.curOnly)+Number(Boolean(state.q))+Number(pinnedOnly);
}
function filtersChanged(){
  rankingPage=0;
  render();
}
function toggleSelect(slug){
  const i=state.selected.indexOf(slug);
  if(i>=0){
    if(state.selected.length===1) return;
    state.selected.splice(i,1);
  } else if(state.selected.length<3) {
    state.selected.push(slug);
  } else {
    $("#comparison-status").classList.remove("sr-only");
    $("#comparison-status").textContent="3개를 비교 중입니다. 상단에서 교체할 모델명을 누르세요.";
    return;
  }
  $("#comparison-status").textContent="";
  render();
}

function buildComparisonSlots(){
 const slots=$("#comparison-slots");slots.replaceChildren();
 state.selected.forEach((slug,i)=>{
   const m=MODELS.find(x=>x.slug===slug);
   const slot=el("div","comparison-slot");slot.style.setProperty("--slot-color",`var(${SERIES[i]})`);
   const name=el("button","replace-slot");name.type="button";name.textContent=m.name;
   name.setAttribute("aria-label",m.name+" 교체");name.title=m.name+" 교체";
   name.setAttribute("aria-controls","model-library");name.setAttribute("aria-expanded","false");
   name.onclick=()=>openPicker(i,name);
   slot.append(name);
   if(state.selected.length>1){
     const remove=el("button");remove.type="button";remove.textContent="×";remove.dataset.remove=m.slug;
     remove.setAttribute("aria-label",m.name+" 비교에서 제외");remove.onclick=()=>{closePicker();toggleSelect(m.slug);$(".add-slot").focus();};slot.append(remove);
   }
   slots.append(slot);
 });
 if(state.selected.length<3){
   const add=el("button","add-slot");add.type="button";add.textContent="+ 모델 추가";
   add.setAttribute("aria-controls","model-library");add.setAttribute("aria-expanded","false");
   add.onclick=()=>openPicker(null,add);
   slots.append(add);
 }
}

__COMPARISON_CHARTS__

// ---------- scatter (가성비) ----------
const costMetrics={
  task:{label:"작업당 비용",axis:"AA 평가 과제 1개당 USD",value:m=>m.aa?.costPerTask,
    note:"AA 평가 과제 하나를 수행하는 데 든 비용입니다. 실제 업무 비용은 요청 길이와 수행 단계에 따라 달라집니다."},
  tokens:{label:"토큰 혼합 단가",axis:"토큰 100만 개당 USD",value:m=>m.price,
    note:"캐시 적중·입력·출력 단가를 7:2:1로 가중한 토큰 100만 개당 가격입니다."}
};
function scatterSVG(){
  const metric=costMetrics[state.costMode];
  const filteredRows=filtered();
  const hasCost=m=>Number.isFinite(metric.value(m)) && metric.value(m)>=0;
  const rows=filteredRows.filter(m=>hasCost(m)&&Number.isFinite(m.intel));
  const controls=Object.entries(costMetrics).map(([id,option])=>
    `<button type="button" data-cost-mode="${id}" aria-pressed="${id===state.costMode}">${option.label}</button>`).join("");
  const missingCost=filteredRows.filter(m=>!hasCost(m)).length;
  const head=`<div class="chart-heading"><h2>비용과 종합지수</h2><div class="cost-modes" role="group" aria-label="비용 기준">${controls}</div></div>
    <p class="chart-note">${metric.note}</p><p class="cost-coverage">${filteredRows.length}개 중 <b>${rows.length}개 표시</b> · 비용 미공개 ${missingCost}개${filteredRows.length-missingCost-rows.length?` · 비용만 공개 ${filteredRows.length-missingCost-rows.length}개`:""}</p>`;
  if(!rows.length) return head+'<p class="empty">비용과 종합지수가 함께 공개된 모델이 없습니다.</p>';
  const W=600,H=370,left=52,right=576,top=18,bottom=309;
  const positive=rows.map(metric.value).filter(v=>v>0);
  const hasZero=positive.length<rows.length;
  const positiveStart=left+(hasZero?55:0);
  const low=positive.length?Math.floor(Math.log10(Math.min(...positive))):0;
  const high=positive.length?Math.max(low+1,Math.ceil(Math.log10(Math.max(...positive)))):1;
  const X=v=>v===0?left:positiveStart+(Math.log10(v)-low)/(high-low)*(right-positiveStart);
  const minScore=Math.min(0,Math.floor(Math.min(...rows.map(m=>m.intel))/20)*20);
  const maxScore=Math.max(20,Math.ceil(Math.max(...rows.map(m=>m.intel))/20)*20);
  const Y=v=>bottom-(v-minScore)/(maxScore-minScore)*(bottom-top);
  const ticks=positive.length?Array.from({length:high-low+1},(_,i)=>10**(low+i)):[];
  if(hasZero) ticks.unshift(0);
  const xGrid=ticks.map(v=>`<line x1="${X(v)}" x2="${X(v)}" y1="${top}" y2="${bottom}" stroke="var(--line-soft)"/><text x="${X(v)}" y="${bottom+18}" text-anchor="middle">${usd(v)}</text>`).join("");
  let yGrid="";
  for(let v=minScore;v<=maxScore;v+=20){
    yGrid+=`<line x1="${left}" x2="${right}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)"/><text x="${left-9}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  }
  const points=rows.sort((a,b)=>state.selected.indexOf(a.slug)-state.selected.indexOf(b.slug)).map(m=>{
    const i=state.selected.indexOf(m.slug),cost=metric.value(m);
    return `<circle data-slug="${safe(m.slug)}" cx="${X(cost)}" cy="${Y(m.intel)}" r="${i>=0?6.5:4.5}" fill="${i>=0?'var('+SERIES[i]+')':'#438eaa'}" fill-opacity="${i>=0?1:.65}" stroke="white"><title>${safe(m.name)} · ${metric.label} ${usd(cost)} · AA 지수 ${dec(m.intel)}</title></circle>`;
  }).join("");
  const keys=state.selected.map((slug,i)=>{
    const m=MODELS.find(m=>m.slug===slug);
    const label=!filteredRows.includes(m)?"필터 밖":!hasCost(m)?"비용 미공개":!Number.isFinite(m.intel)?"지수 미측정":usd(metric.value(m));
    return `<span style="--slot-color:var(${SERIES[i]})"><b>${safe(m.name)}</b> · ${label}</span>`;
  }).join("");
  return head+`<svg class="price-chart" role="img" aria-label="${metric.label}과 AA 종합지수" viewBox="0 0 ${W} ${H}">
    ${xGrid}${yGrid}<text x="15" y="163" text-anchor="middle" transform="rotate(-90 15 163)">AA 종합지수</text>
    <text x="314" y="358" text-anchor="middle">${metric.axis}${positive.length?(hasZero?' (로그 눈금, $0 별도)':' (로그 눈금)'):''}</text>${points}</svg><div class="chart-keys">${keys}</div>`;
}

// ---------- right panel ----------
const DASH="—";
const smallUSD=new Intl.NumberFormat("ko-KR",{maximumSignificantDigits:3});
const usd=v=>!Number.isFinite(v)?DASH:"$"+(v>0&&v<1?smallUSD.format(v):dec(v));
const licLab=l=>l==='Open'?'오픈':l==='Proprietary'?'독점':l||'';

// 배지 뷰와 비교표가 함께 읽는 단일 지표 목록.
// dir: +1 클수록 좋음 / -1 작을수록 좋음 / 0 강조 안 함(범주형)
const METRICS=[
  {k:"종합지능",    g:m=>m.intel,      dir:+1},
  {k:"작업당 비용", g:m=>m.aa?.costPerTask??null, dir:-1, fmt:usd, unit:" / AA 과제",tip:"AA v5 평가 과제당 비용. 실제 사용자 작업비용과 다릅니다."},
  {k:"혼합가",      g:m=>m.price,      dir:-1, fmt:usd, unit:"/1M",
   tip:"AA 혼합가 — 캐시히트 7 : 입력 2 : 출력 1 가중. 가성비 계산의 분모"},
  {k:"입력가",      g:m=>m.price_in,   dir:-1, fmt:usd, unit:"/1M"},
  {k:"출력가",      g:m=>m.price_out,  dir:-1, fmt:usd, unit:"/1M"},
  {k:"컨텍스트",    g:m=>m.ctx,        dir:+1, fmt:fmtCtx},
  {k:"속도",        g:m=>m.speed,      dir:+1, unit:" t/s"},
  {k:"첫 답변 대기", g:m=>m.aa?.firstAnswer??null,       dir:-1, unit:" s",
   tip:"첫 답변 토큰이 나올 때까지의 대기. 전체 응답 완료시간과 다릅니다."},
  {k:"과제 시간", g:m=>m.aa?.timePerTask==null?null:m.aa.timePerTask/60, dir:-1, unit:" 분"},
  {k:"멀티모달",    g:m=>m.radar.multimodal.measured?"측정":"미측정", dir:0},
  {k:"크기",        g:m=>m.size==="Unknown"?"미상":m.size, dir:0,
   sub:m=>m.params!=null?` ${m.params}B`:""},
  {k:"추론 / 상태", g:m=>m.reasoning===true?"추론":m.reasoning===false?"비추론":DASH, dir:0,
   sub:m=>` · ${m.status}`},
];

function cellOf(mt,m){
  const raw=mt.g(m);
  const body=mt.fmt?mt.fmt(raw):(raw==null?DASH:typeof raw==="number"?dec(raw):String(raw));
  const sub=mt.sub?mt.sub(m):(raw==null?"":(mt.unit||""));
  return {raw,body,sub};
}

// 행 안에서 '더 좋은' 값의 열 인덱스. 동점은 모두 포함한다 —
// 하나만 고르면 값이 같은데 우열이 있는 것처럼 읽힌다.
// 비교가 성립하지 않는 행(유효값 1개 이하, 전원 동점)은 아예 강조하지 않는다.
// 전부 녹색인 행은 정보를 주지 않고 눈만 어지럽힌다.
function bestIdx(mt,sel){
  if(!mt.dir) return new Set();
  const nums=sel.map(m=>{const v=mt.g(m);return typeof v==="number"?v:null;});
  const cand=nums.filter(v=>v!=null);
  if(cand.length<2) return new Set();
  const best=mt.dir>0?Math.max(...cand):Math.min(...cand);
  const hits=nums.map((v,i)=>v===best?i:-1).filter(i=>i>=0);
  return hits.length===nums.length ? new Set() : new Set(hits);
}

// 레이더 8축을 숫자로. 차트가 이미 겹쳐 보여주므로 기본은 접어 둔다.
function axesHTML(sel){
  const rows=AX.map(ax=>{
    // 본표와 같은 강조 규칙을 쓴다 (동점 모두 / 전원 동점·유효값 1개는 강조 없음).
    // r 은 평균 대비 반경이라 8축 모두 클수록 좋음. 미측정은 null 로 넘겨 후보에서 빠진다.
    const best=bestIdx({g:m=>measuredLegacy(m,ax), dir:+1}, sel);
    const tds=sel.map((m,i)=>{
      const d=m.radar[ax];
      return measuredLegacy(m,ax)!=null
        ? `<td class="${best.has(i)?"best":""}">${d.r}</td>`
        : `<td class="na">미측정</td>`;
    }).join("");
    return `<tr><th>${LAB[ax]}</th>${tds}</tr>`;
  }).join("");
  return `<details class="cmp-axes"${state.axesOpen?" open":""}>`
    +`<summary>구형 8축 점수 (평균=50)</summary>`
    +`<div class="cmp-wrap"><table class="cmp-tbl"><tbody>${rows}</tbody></table></div>`
    +`<p class="axnote">50점은 해당 축에 실측이 있는 모델의 평균입니다.</p></details>`;
}

function badgeView(m){
  const badges=METRICS.map(mt=>{
    const c=cellOf(mt,m);
    return `<div class="badge"${mt.tip?` title="${mt.tip}"`:""}>`
      +`<div class="k">${mt.k}</div>`
      +`<div class="v">${c.body}${c.sub?`<small>${c.sub}</small>`:""}</div></div>`;
  }).join("");
  return `<div class="ph">
      <div class="panel-heading"><span class="mini-marker"></span>모델 상세</div>
      <div class="creator">${safe(m.creator)} · ${licLab(m.license)}</div>
      <h2>${safe(m.name)}</h2>
      <div class="badges">${badges}</div>
    </div>`;
}

function compareView(sel){
  const head=sel.map((m,i)=>
    `<th><span class="sw" style="background:var(${SERIES[i]})"></span>`
    +`<span class="nm" title="${safe(m.name)}">${safe(m.name)}</span>`
    +`<span class="cr">${safe(m.creator)} · ${licLab(m.license)}</span></th>`).join("");
  const rows=METRICS.map(mt=>{
    const best=bestIdx(mt,sel);
    const tds=sel.map((m,i)=>{
      const c=cellOf(mt,m);
      return `<td class="${best.has(i)?"best":""}">${c.body}${c.sub?`<small>${c.sub}</small>`:""}</td>`;
    }).join("");
    return `<tr><th${mt.tip?` title="${mt.tip}"`:""}>${mt.k}</th>${tds}</tr>`;
  }).join("");
  // cmp-main = 실용 지표 본표. 8축 표와 구분해야 스타일·조회가 섞이지 않는다.
  return `<div class="panel-heading"><span class="mini-marker"></span>모델별 지표</div><div class="cmp-wrap"><table class="cmp-tbl cmp-main">`
    +`<thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
    +(state.view==="radar" && state.radarMode==="legacy" ? axesHTML(sel) : "");
}

function panelHTML(){
  const p=$("#panel");
  // render() 가 패널을 innerHTML 로 덮어쓰므로 펼침 상태를 밖에 보관해야
  // 슬라이더만 건드려도 다시 접히는 일이 없다.
  // toggle 이벤트는 비동기라 클릭과 같은 틱에 리렌더가 걸리면 놓친다 —
  // 이벤트에 기대지 말고 덮어쓰기 직전에 실제 DOM 상태를 읽는다.
  const cur=p.querySelector(".cmp-axes");
  if(cur) state.axesOpen=cur.open;
  const sel=state.selected.map(s=>MODELS.find(x=>x.slug===s)).filter(Boolean);
  if(!sel.length){p.innerHTML='<div class="empty">모델을 선택하세요</div>';return;}
  p.innerHTML = sel.length===1 ? badgeView(sel[0]) : compareView(sel);
}

// ---------- legend ----------
function legendHTML(){
  const lg=$("#legend"),hint=$("#hint");
  lg.innerHTML="";
  hint.textContent=state.view==="scatter"?"점을 눌러 비교 모델을 추가하거나 뺄 수 있습니다. 왼쪽 위에 가까울수록 비용이 낮고 종합지수가 높습니다.":"";

}

// ---------- render ----------
function render(){
  document.querySelectorAll("details[data-evidence], details[data-size]").forEach(d=>{
    const opened=d.dataset.evidence ? state.openEvidence : state.openSizes;
    const key=d.dataset.evidence || d.dataset.size;
    if(d.open) opened.add(key); else opened.delete(key);
  });
  document.querySelector(".grid").classList.toggle("cmp", state.selected.length>1);
  const sel=state.selected.map(id=>MODELS.find(m=>m.slug===id)).filter(Boolean);
  closePicker();
  buildComparisonSlots();
  $("#cmpnote").textContent=state.selected.length+" / 3";
  $("#filter-count").textContent=filterCount()||"";
  panelHTML();legendHTML();
  if(state.view==="explore"){
    $("#viewwrap").innerHTML=explorerHTML();
    $("#panel").innerHTML=evidenceHTML(sel);$("#legend").innerHTML="";$("#hint").textContent="모델명을 눌러 최대 3개를 비교하세요. 선택은 최소 1개 유지되며, 3개일 때는 먼저 하나를 해제하세요.";bindExplorer();return;
  }
  const wrap=$("#viewwrap");
  if(state.view==="radar"){
    wrap.innerHTML=radarHTML(sel)+benchmarkTables(sel);
    $("#radar-mode").onchange=e=>{state.radarMode=e.target.value;render();};
    return;
  }
  wrap.innerHTML=state.view==="size"?sizeHTML(sel):scatterSVG();
  wrap.querySelectorAll("[data-cost-mode]").forEach(b=>b.onclick=()=>{
    state.costMode=b.dataset.costMode;render();
    wrap.querySelector('[data-cost-mode="'+state.costMode+'"]').focus({preventScroll:true});
  });
  const sizeMode=$("#size-mode");
  if(sizeMode) sizeMode.onchange=e=>{state.sizeMode=e.target.value;render();};
  wrap.querySelectorAll("circle[data-slug]").forEach(c=>c.onclick=()=>toggleSelect(c.dataset.slug));
  wrap.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>toggleSelect(b.dataset.model));
  wrap.querySelectorAll("[data-add-model]").forEach(b=>b.onclick=()=>toggleSelect(b.dataset.addModel));

}
